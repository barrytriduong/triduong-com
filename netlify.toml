[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "https://www.triduong.com/*"
  to = "https://triduong.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/vi"
  to = "/?lang=vi"
  status = 302

# CV sources and PDFs (contain phone number) are kept in the repo but never served
[[redirects]]
  from = "/cv/*"
  to = "/"
  status = 404
  force = true
