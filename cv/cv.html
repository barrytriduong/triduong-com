<style>
@page{size:A4;margin:0}
:root{
  --ink:#141a2e;--body:#3a4260;--muted:#6b7392;--line:#e3e7f2;--soft:#f5f7fc;
  --cyan:#06b6d4;--violet:#7c4dff;--pink:#e040a0;--green:#10b981;
  --grad:linear-gradient(100deg,#06b6d4,#7c4dff 55%,#e040a0);
  --sans:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
body{font-family:var(--sans);color:var(--body);font-size:8.55pt;line-height:1.38;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;position:relative;overflow:hidden;display:grid;grid-template-columns:58mm 1fr}
.page::before{content:"";position:absolute;left:0;right:0;top:0;height:2.2mm;background:var(--grad)}

/* sidebar */
aside{background:var(--soft);padding:11mm 6mm 10mm 8mm;border-right:1px solid var(--line)}
.photo{width:34mm;height:34mm;border-radius:50%;padding:1.1mm;background:var(--grad);margin:0 auto 5mm}
.photo img{width:100%;height:100%;border-radius:50%;display:block;background:#fff}
.sh{font-family:var(--mono);font-size:7.2pt;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--violet);margin:4.6mm 0 2.2mm;display:flex;align-items:center;gap:2mm}
.sh::after{content:"";flex:1;height:1px;background:var(--line)}
aside .sh:first-of-type{margin-top:0}
.ct{display:grid;gap:1.8mm}
.ct div{display:grid;grid-template-columns:5mm 1fr;align-items:start}
.ct .ic{font-family:var(--mono);color:var(--cyan);font-size:8pt}
.ct span:last-child{color:var(--ink);word-break:break-word}
.ct small{display:block;font-family:var(--mono);font-size:6.6pt;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.skills{list-style:none;display:grid;gap:1.1mm}
.skills li{padding-left:3.6mm;position:relative;color:var(--ink)}
.skills li::before{content:"";position:absolute;left:0;top:1.75mm;width:1.6mm;height:1.6mm;border-radius:50%;background:var(--grad)}
.edu{margin-bottom:3mm}
.edu b{display:block;color:var(--ink);font-weight:600}
.edu .when{font-family:var(--mono);font-size:7.4pt;color:var(--cyan)}
.hl{display:inline-block;margin-top:1mm;font-family:var(--mono);font-size:7.2pt;font-weight:500;color:#fff;background:var(--grad);padding:.5mm 2mm;border-radius:1mm}
.lang{display:flex;justify-content:space-between;padding:1.2mm 0;border-bottom:1px dashed var(--line);color:var(--ink)}
.lang:last-child{border:0}
.lang span:last-child{color:var(--muted)}

/* main */
main{padding:11mm 11mm 9mm 9mm}
.tagline{font-family:var(--mono);font-size:7.6pt;color:var(--cyan);letter-spacing:.06em}
h1{font-size:26pt;line-height:1;letter-spacing:-.03em;color:var(--ink);font-weight:700;margin:1.6mm 0 1.6mm}
h1 span{color:var(--violet)}
.role{font-size:10.5pt;color:var(--ink);font-weight:500}
.role em{font-style:normal;color:var(--muted);font-weight:400}
.summary{margin-top:3.6mm;padding:2.8mm 3.6mm;border-radius:2mm;background:var(--soft);border-left:1mm solid var(--violet);color:var(--body);font-size:8.6pt}
.mh{font-family:var(--mono);font-size:7.6pt;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--violet);margin:4.6mm 0 2.6mm;display:flex;align-items:center;gap:2.5mm}
.mh::after{content:"";flex:1;height:1px;background:var(--line)}
.job{position:relative;padding-left:5mm;margin-bottom:2.8mm;break-inside:avoid}
.job::before{content:"";position:absolute;left:.6mm;top:1.6mm;width:2mm;height:2mm;border-radius:50%;border:.45mm solid var(--cyan);background:#fff}
.job::after{content:"";position:absolute;left:1.42mm;top:4.2mm;bottom:-2.6mm;width:.35mm;background:var(--line)}
.job:last-child::after{display:none}
.job.now::before{background:var(--cyan)}
.jh{display:flex;justify-content:space-between;align-items:baseline;gap:4mm}
.jh h3{font-size:10pt;color:var(--ink);font-weight:600;letter-spacing:-.01em}
.jh .when{font-family:var(--mono);font-size:7.6pt;color:var(--cyan);white-space:nowrap}
.org{font-family:var(--mono);font-size:7.6pt;color:var(--violet);margin:.2mm 0 1.1mm}
.badge{display:inline-block;font-family:var(--mono);font-size:7pt;color:var(--pink);border:1px solid rgba(224,64,160,.35);background:rgba(224,64,160,.06);border-radius:5mm;padding:.5mm 2.4mm;margin-bottom:1.2mm}
.job ul{list-style:none;display:grid;gap:.6mm}
.job li{padding-left:3.2mm;position:relative}
.job li::before{content:"▹";position:absolute;left:0;color:var(--cyan);font-size:8pt}
.job li b{color:var(--ink);font-weight:600}
.mini{display:flex;justify-content:space-between;gap:4mm;align-items:baseline}
.mini h4{font-size:9.2pt;color:var(--ink);font-weight:600}
.mini .when{font-family:var(--mono);font-size:7.4pt;color:var(--cyan);white-space:nowrap}
.mini + p{margin:.2mm 0 1.8mm}
.teach > div:last-child p{margin-bottom:0}
footer{position:absolute;left:58mm;right:0;bottom:5mm;padding:0 11mm 0 9mm;display:flex;justify-content:space-between;font-family:var(--mono);font-size:6.8pt;color:var(--muted)}
footer a{color:var(--violet);text-decoration:none}
</style>
</head>
